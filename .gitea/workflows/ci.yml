# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# Зеркало .github/workflows/ci.yml для внутреннего инстанса Gitea.
# Отличие от GitHub-версии одно — сайт документации здесь только собирается
# как проверка и никуда не выкладывается: Pages у Gitea нет.

name: CI

on:
  push:
    branches: ['**']

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  # SDK 10 умеет собирать net9.0, но dotnet test поднимает сборки каждого
  # таргета на своём рантайме, поэтому нужен и девятый.
  DOTNET_VERSION: |
    9.0.x
    10.0.x

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          # Версии живут в Directory.Packages.props и различаются по TFM,
          # поэтому файл входит в ключ наравне с проектами
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Pack (validate packaging)
        run: dotnet pack --configuration Release --no-build --output ./nupkg

      # Отдельный solution: корневой restore его не видит, поэтому без --no-restore.
      # Ломающие изменения публичного API ловятся именно здесь
      - name: Build samples
        run: dotnet build samples/AndreyAkaSkif.ServiceDefaults.Samples.slnx --configuration Release

      # Спецификация примера собирается предыдущим шагом и лежит в репозитории:
      # расхождение означает незамеченное изменение контракта
      - name: Check generated specification
        run: git diff --exit-code -- samples/src/AndreyAkaSkif.ServiceDefaults.Samples.Api/openapi

      - name: Restore .NET tools
        run: dotnet tool restore

      # Только проверка: готовый сайт здесь никуда не выкладывается, Pages у
      # Gitea нет
      - name: Build documentation
        run: dotnet docfx docs/docfx.json
