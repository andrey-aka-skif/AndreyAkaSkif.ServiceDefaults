# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Continuous Integration

on:
    push:
        branches: ['**']
    pull_request:
        types: [opened, synchronize, reopened]
    workflow_call: {}

jobs:
    run-ci:
        runs-on: ubuntu-latest
        steps:
            - name: 🛒 Checkout
              uses: actions/checkout@v7

            # SDK 10 умеет собирать net9.0, но dotnet test не запустит net9-ветку
            # без установленного рантайма 9
            - name: ✨ Setup .NET
              uses: actions/setup-dotnet@v6
              with:
                dotnet-version: |
                  9.0.x
                  10.0.x

            - name: 💾 Cache NuGet packages
              uses: actions/cache@v6
              with:
                path: ~/.nuget/packages
                # Версии живут в Directory.Packages.props и различаются по TFM,
                # поэтому файл входит в ключ наравне с проектами
                key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
                restore-keys: ${{ runner.os }}-nuget-

            - name: 🚚 Restore
              run: dotnet restore

            - name: 🛠️ Build
              run: dotnet build --configuration Release --no-restore

            - name: 🧪 Test
              run: dotnet test --configuration Release --no-build --verbosity normal

            # Отдельный solution: корневой restore его не видит, поэтому без --no-restore
            - name: 🧩 Build samples
              run: dotnet build samples/AndreyAkaSkif.ServiceDefaults.Samples.slnx --configuration Release
